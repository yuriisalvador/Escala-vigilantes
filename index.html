<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escala de Extra - Vigilantes</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f0f2f5; margin: 0; padding: 10px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #002060; font-size: 1.2rem; margin-bottom: 5px; }
        .subtitle { text-align: center; font-size: 0.85rem; color: #666; margin-bottom: 15px; }
        
        .panel { background: #e8eef5; border: 1px solid #b4c6e7; padding: 10px; border-radius: 6px; margin-bottom: 15px; font-size: 0.9rem; }
        .panel b { color: #002060; }

        table { width: 100%; border-collapse: collapse; margin-bottom: 15px; font-size: 0.85rem; }
        th, td { border: 1px solid #000; padding: 6px 4px; text-align: center; }
        th { background-color: #7f7f7f; color: #fff; }
        
        .col-seq { width: 22%; font-weight: bold; font-size: 0.75rem; }
        .col-num { width: 12%; }
        .col-nome { width: 44%; text-align: left; padding-left: 8px; font-weight: bold; }
        .col-qtd { width: 11%; }

        .proximo { background-color: #002060 !important; color: #fff !important; }
        
        .login-admin { text-align: center; margin: 15px 0; }
        .btn-login { background-color: #6c757d; color: white; border: none; padding: 8px 12px; font-size: 0.85rem; border-radius: 4px; cursor: pointer; }

        .admin-box { background: #fff3cd; border: 1px solid #ffeeba; padding: 10px; border-radius: 6px; margin-top: 15px; display: none; }
        .admin-box h4 { margin: 0 0 8px 0; color: #856404; font-size: 0.95rem; }
        select, button { padding: 6px; margin: 4px 0; font-size: 0.85rem; width: 100%; box-sizing: border-box; }
        
        .btn-aceito { background-color: #28a745; color: white; border: none; font-weight: bold; cursor: pointer; border-radius: 4px; }
        .btn-sair { background-color: #dc3545; color: white; border: none; padding: 4px 8px; font-size: 0.75rem; border-radius: 4px; float: right; cursor: pointer; }
        
        .history { font-size: 0.8rem; margin-top: 15px; border-top: 1px solid #ddd; padding-top: 10px; }
        .history-item { padding: 4px 0; border-bottom: 1px dashed #eee; }
        .loading { text-align: center; font-style: italic; color: #666; font-size: 0.8rem; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>ESCALA DE EXTRA - VIGILANTES</h2>
    <div class="subtitle">Julimar Paiva / Dias Várzea</div>

    <div class="loading" id="msgCarregando">Sincronizando com a nuvem...</div>

    <div class="panel" id="infoPanel">
        <div><b>Vigilante da Vez:</b> <span id="lblVez">ELISNA</span></div>
        <div><b>Próximo na Fila:</b> <span id="lblDepois">DEVISON</span></div>
    </div>

    <table>
        <thead>
            <tr>
                <th>SEQUÊNCIA</th>
                <th>Nº</th>
                <th>VIGILANTES NOMES</th>
                <th>ACEITOS</th>
                <th>NEGADOS</th>
            </tr>
        </thead>
        <tbody id="tabelaCorpo">
            <!-- Gerado via JavaScript -->
        </tbody>
    </table>

    <!-- Botão de Acesso Admin -->
    <div class="login-admin" id="divLoginBtn">
        <button class="btn-login" onclick="fazerLogin()">🔒 Área do Administrador</button>
    </div>

    <!-- Painel Protegido do ADM -->
    <div class="admin-box" id="adminPainel">
        <button class="btn-sair" onclick="fazerLogout()">Sair do ADM</button>
        <h4>Painel do Encarregado (Lançar Resposta)</h4>
        <select id="selectVigilante">
            <option value="">Selecione o vigilante consultado...</option>
        </select>
        <select id="selectStatus">
            <option value="ACEITOU">ACEITOU</option>
            <option value="NEGOU">NEGOU</option>
        </select>
        <button class="btn-aceito" onclick="registrarExtra()">REGISTRAR RESPOSTA</button>
    </div>

    <div class="history">
        <b>Histórico de Chamados:</b>
        <div id="listaHistorico">Nenhum registro ainda.</div>
    </div>
</div>

<script>
    const SHEETDB_URL = "https://sheetdb.io/api/v1/j5ovgvrzvutpq";
    const SENHA_ADMIN = "Escala26"; 

    const nomesVigilantes = [
        "MARCILENE", "LUCAS", "JASELMO", "JOSIVAN", "MÁRIO", "AURÉLIO", 
        "CLOVES", "STAYNE", "TAVARES", "ELISNA", "DEVISON", "BALBINO", 
        "GONÇALVES", "ARISTIDES", "LEMOS", "GEAN", "CORREIA", "SALVADOR", 
        "WASHINGTON", "HELENA", "VITÓRIA"
    ];

    let currentIndex = 9;
    let historico = [];
    let estatisticas = {};

    nomesVigilantes.forEach(n => {
        estatisticas[n] = { aceitos: 0, negados: 0 };
    });

    async function carregarDadosDaNuvem() {
        try {
            let response = await fetch(SHEETDB_URL);
            let data = await response.json();
            
            if (data && data.length > 0) {
                let registro = data[0]; // Pega a primeira linha da planilha
                currentIndex = parseInt(registro.currentIndex) || 9;
                
                if (registro.historico && registro.historico !== "Nenhum registro") {
                    try { historico = JSON.parse(registro.historico); } catch(e) { historico = []; }
                }
                
                if (registro.estatisticas && registro.estatisticas !== "{}") {
                    try { estatisticas = JSON.parse(registro.estatisticas); } catch(e) {}
                }
            }
            document.getElementById("msgCarregando").style.display = "none";
            atualizarTela();
        } catch (error) {
            document.getElementById("msgCarregando").textContent = "Erro ao sincronizar. Usando dados locais.";
            atualizarTela();
        }
    }

    async function salvarDadosNaNuvem() {
        let dadosParaSalvar = {
            currentIndex: currentIndex,
            historico: JSON.stringify(historico),
            estatisticas: JSON.stringify(estatisticas)
        };

        try {
            await fetch(`${SHEETDB_URL}/id/1`, {
                method: 'PUT',
                headers: {
                    'Accept': 'application/json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ data: dadosParaSalvar })
            });
        } catch (error) {
            console.error("Erro ao salvar na nuvem:", error);
        }
    }

    function atualizarTela() {
        const tbody = document.getElementById("tabelaCorpo");
        tbody.innerHTML = "";
        
        const selectVig = document.getElementById("selectVigilante");
        selectVig.innerHTML = '<option value="">Selecione o vigilante consultado...</option>';
        nomesVigilantes.forEach(n => {
            let opt = document.createElement("option");
            opt.value = n;
            opt.textContent = n;
            selectVig.appendChild(opt);
        });

        nomesVigilantes.forEach((nome, idx) => {
            let numSeq = idx + 1;
            let tr = document.createElement("tr");
            
            let tdSeq = document.createElement("td");
            tdSeq.className = "col-seq";
            if (idx === currentIndex) {
                tdSeq.textContent = "PRÓXIMO 1";
                tdSeq.classList.add("proximo");
            }

            let tdNum = document.createElement("td");
            tdNum.className = "col-num";
            tdNum.textContent = numSeq + "º";

            let tdNome = document.createElement("td");
            tdNome.className = "col-nome";
            tdNome.textContent = nome;

            let stats = estatisticas[nome] || { aceitos: 0, negados: 0 };
            let tdAceitos = document.createElement("td");
            tdAceitos.className = "col-qtd";
            tdAceitos.textContent = stats.aceitos;

            let tdNegados = document.createElement("td");
            tdNegados.className = "col-qtd";
            tdNegados.textContent = stats.negados;

            tr.appendChild(tdSeq);
            tr.appendChild(tdNum);
            tr.appendChild(tdNome);
            tr.appendChild(tdAceitos);
            tr.appendChild(tdNegados);
            tbody.appendChild(tr);
        });

        document.getElementById("lblVez").textContent = nomesVigilantes[currentIndex];
        let nextIdx = (currentIndex + 1) % nomesVigilantes.length;
        document.getElementById("lblDepois").textContent = nomesVigilantes[nextIdx];

        let histDiv = document.getElementById("listaHistorico");
        if(historico.length === 0) {
            histDiv.innerHTML = "Nenhum registro ainda.";
        } else {
            histDiv.innerHTML = historico.slice(-5).reverse().map(h => 
                `<div class="history-item"><b>${h.nome}</b> - <span style="color:${h.status==='ACEITOU'?'green':'red'}">${h.status}</span> (${h.data})</div>`
            ).join('');
        }
    }

    function fazerLogin() {
        let senhaDigitada = prompt("Digite a senha de Administrador:");
        if (senhaDigitada === SENHA_ADMIN) {
            document.getElementById("adminPainel").style.display = "block";
            document.getElementById("divLoginBtn").style.display = "none";
            alert("Acesso liberado, ADM!");
        } else if (senhaDigitada !== null) {
            alert("Senha incorreta!");
        }
    }

    function fazerLogout() {
        document.getElementById("adminPainel").style.display = "none";
        document.getElementById("divLoginBtn").style.display = "block";
    }

    async function registrarExtra() {
        let nome = document.getElementById("selectVigilante").value;
        let status = document.getElementById("selectStatus").value;

        if(!nome) {
            alert("Selecione um vigilante!");
            return;
        }

        if(!estatisticas[nome]) {
            estatisticas[nome] = { aceitos: 0, negados: 0 };
        }

        if(status === "ACEITOU") {
            estatisticas[nome].aceitos++;
        } else {
            estatisticas[nome].negados++;
        }

        let idxEscolhido = nomesVigilantes.indexOf(nome);
        currentIndex = (idxEscolhido + 1) % nomesVigilantes.length;

        let dataHora = new Date().toLocaleDateString('pt-BR') + ' ' + new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'});
        historico.push({ nome, status, data: dataHora });

        atualizarTela();
        document.getElementById("selectVigilante").value = "";
        alert("Salvando na nuvem... Aguarde um instante.");

        await salvarDadosNaNuvem();
        alert("Registro salvo com sucesso e sincronizado para todos!");
    }

    // Carrega os dados da nuvem assim que a página abre
    window.onload = carregarDadosDaNuvem;
</script>

</body>
</html>
